services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: marksman_test
      POSTGRES_USER: marksman_test
      POSTGRES_PASSWORD: marksman_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marksman_test -d marksman_test"]
      interval: 1s
      timeout: 5s
      retries: 30
